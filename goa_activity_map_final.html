<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Goa Activity Map</title>
  <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body, #map {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #222;
      background: #f4f5f7;
    }
    #map {
      height: 100vh;
      z-index: 1;
    }
    #sidebar {
      position: absolute;
      top: 12px;
      left: 12px;
      bottom: 12px;
      width: 320px;
      max-width: calc(100vw - 24px);
      z-index: 1000;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #e1e4e8;
      background: #fff;
    }
    .sidebar-header h2 {
      font-size: 16px;
      font-weight: 700;
      color: #1a1f2c;
      margin-bottom: 2px;
    }
    .count-text {
      font-size: 12px;
      color: #586069;
    }
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      font-size: 13px;
    }
    .filter-group {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eaecef;
    }
    .filter-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #24292e;
      margin-bottom: 6px;
    }
    .search-input, .select-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5da;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background: #fff;
    }
    .search-input:focus, .select-input:focus {
      border-color: #343a40;
    }
    .button-group {
      display: flex;
      gap: 4px;
      background: #f1f3f5;
      padding: 2px;
      border-radius: 4px;
    }
    .group-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 5px 2px;
      font-size: 11px;
      font-weight: 500;
      color: #495057;
      border-radius: 3px;
      cursor: pointer;
    }
    .group-btn.active {
      background: #fff;
      color: #343a40;
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    .dropdown-container {
      position: relative;
    }
    .dropdown-btn {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #d1d5da;
      border-radius: 6px;
      background: #fff;
      font-size: 13px;
      color: #24292e;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid #d1d5da;
      border-radius: 6px;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
      padding: 8px;
      z-index: 1200;
      max-height: 220px;
      overflow-y: auto;
    }
    .dropdown-container.open .dropdown-menu {
      display: block;
    }
    .dropdown-search {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d1d5da;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 6px;
      outline: none;
    }
    .dropdown-actions {
      display: flex;
      justify-content: space-between;
      padding: 4px 0 6px;
      border-bottom: 1px solid #eaecef;
      margin-bottom: 4px;
    }
    .dropdown-action-btn {
      background: none;
      border: none;
      color: #343a40;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
    }
    .dropdown-item:hover {
      background: #f6f8fa;
    }
    .checkbox-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .count-pill {
      font-size: 11px;
      color: #6a737d;
      background: #f6f8fa;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .category-check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 6px;
      font-size: 12px;
      color: #24292e;
      cursor: pointer;
      border-radius: 4px;
    }
    .category-check-item:hover {
      background: #f6f8fa;
    }
    .cat-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .cat-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .category-check-item input {
      cursor: pointer;
      flex-shrink: 0;
    }
    .sidebar-footer {
      padding: 10px 16px;
      border-top: 1px solid #e1e4e8;
      display: flex;
      gap: 8px;
      background: #fff;
    }
    .btn {
      flex: 1;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid #d1d5da;
      text-align: center;
    }
    .btn-default {
      background: #f6f8fa;
      color: #24292e;
    }
    .btn-primary {
      background: #343a40;
      color: #fff;
      border-color: #343a40;
    }
    #mobile-toggle {
      display: none;
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1100;
      background: #fff;
      border: 1px solid #d1d5da;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
    }
    .leaflet-popup-content-wrapper {
      padding: 0;
      border-radius: 6px;
      box-shadow: 0 3px 12px rgba(0,0,0,.18);
    }
    .leaflet-popup-content {
      margin: 0;
      width: 400px !important;
      box-sizing: border-box;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.4;
      color: #24292e;
    }
    .popup-title {
      font-size: 14px;
      font-weight: 700;
      color: #343a40;
      margin-bottom: 2px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .popup-sub {
      font-size: 11px;
      color: #586069;
      margin-bottom: 8px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .popup-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 8px;
    }
    .tag {
      font-size: 10px;
      padding: 2px 6px;
      background: #f1f3f5;
      border-radius: 4px;
      color: #495057;
      font-weight: 500;
    }
    .rate-row {
      font-size: 12px;
      color: #24292e;
      margin-bottom: 6px;
    }
    .activity-list {
      max-height: 280px;
      overflow-y: auto;
      overflow-x: hidden;
      border-top: 1px solid #eaecef;
      margin-top: 8px;
      padding-top: 6px;
    }
    .activity-item {
      padding: 6px 0;
      border-bottom: 1px solid #f0f2f4;
    }
    .activity-item:last-child {
      border-bottom: none;
    }
    .activity-name {
      font-size: 12px;
      font-weight: 650;
      line-height: 1.3;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .activity-meta {
      font-size: 10px;
      color: #6a737d;
      margin-top: 2px;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }
    .activity-link {
      display: block;
      text-align: center;
      background: #343a40;
      color: #fff !important;
      text-decoration: none;
      padding: 7px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
      margin-top: 8px;
    }
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
      background: rgba(52,58,64,.18);
    }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
      background: #343a40;
      color: #fff;
      font-weight: 700;
    }
    @media(max-width: 600px) {
      .leaflet-popup-content {
        width: calc(100vw - 70px) !important;
      }
      #mobile-toggle {
        display: block;
      }
      #sidebar {
        top: 0;
        left: 0;
        bottom: 0;
        width: 100%;
        max-width: 100vw;
        border-radius: 0;
        transform: translateX(-100%);
        transition: transform .25s ease;
      }
      #sidebar.mobile-open {
        transform: translateX(0);
      }
    }
  </style>
</head>

<body>
  <button id="mobile-toggle">Filters (<span id="mobileCount">0</span>)</button>
  
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>Goa Activity Map</h2>
      <div class="count-text" id="activityCount">Loading activities...</div>
    </div>
    <div class="sidebar-content">
      <div class="filter-group">
        <label class="filter-label">Search</label>
        <input class="search-input" id="keywordSearch" placeholder="Activity, vendor, category, location..."/>
      </div>
      <div class="filter-group">
        <label class="filter-label">Area</label>
        <div class="button-group" id="areaGroup">
          <button class="group-btn active" data-area="all">All</button>
          <button class="group-btn" data-area="North Goa">North</button>
          <button class="group-btn" data-area="South Goa">South</button>
        </div>
      </div>
      <div class="filter-group">
        <label class="filter-label">Category</label>
        <div class="dropdown-actions" style="border-bottom:none;padding-top:0;">
          <button class="dropdown-action-btn" id="selectAllCategories">Select all</button>
          <button class="dropdown-action-btn" id="clearAllCategories">Clear</button>
        </div>
        <div class="checkbox-list" id="categoryList"></div>
      </div>
      <div class="filter-group">
        <label class="filter-label">Vendor</label>
        <div class="dropdown-container" id="vendorDropdown">
          <button class="dropdown-btn" id="vendorBtn">
            <span id="vendorLabel">All vendors</span>
            <span>▾</span>
          </button>
          <div class="dropdown-menu" id="vendorMenu">
            <input class="dropdown-search" id="vendorSearch" placeholder="Search vendors..."/>
            <div class="dropdown-actions">
              <button class="dropdown-action-btn" id="selectAllVendors">Select all</button>
              <button class="dropdown-action-btn" id="clearAllVendors">Clear</button>
            </div>
            <div id="vendorList"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="sidebar-footer">
      <button class="btn btn-default" id="resetBtn">Reset</button>
      <button class="btn btn-primary" id="fitBtn">Fit Map</button>
    </div>
  </div>

  <div id="map"></div>

  <div id="csvFallback" style="display:none;position:absolute;top:0;left:0;right:0;bottom:0;z-index:5000;background:rgba(244,245,247,.97);align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;">
    <div style="max-width:420px;background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.15);">
      <h2 style="font-size:16px;margin-bottom:8px;color:#1a1f2c;">Load activity data</h2>
      <p style="font-size:13px;color:#586069;margin-bottom:16px;">Browser blocked the automatic file load (occurs when opening an HTML file directly). Select the CSV file to continue.</p>
      <input type="file" id="csvFileInput" accept=".csv" style="font-size:13px;"/>
      <div id="csvFallbackError" style="color:#c0392b;font-size:12px;margin-top:10px;"></div>
    </div>
  </div>

  <script>

  let ACTIVITIES = [];
  let markers = [];
  let selectedArea = 'all';

  const MAP_CENTER = [15.38, 73.88];
  const DEFAULT_ZOOM = 10;
  const GOA_BOUNDS = L.latLngBounds([14.85, 73.60], [15.90, 74.40]);

  const map = L.map('map', {
    center: MAP_CENTER,
    zoom: DEFAULT_ZOOM,
    zoomControl: false,
    minZoom: 9,
    maxZoom: 18,
    maxBounds: GOA_BOUNDS.pad(0.15),
    maxBoundsViscosity: 1.0
  });

  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  let cluster;
  try {
    if (typeof L.markerClusterGroup !== 'function') throw new Error('MarkerCluster unavailable');
    cluster = L.markerClusterGroup({
      showCoverageOnHover: false,
      spiderfyOnMaxZoom: true,
      disableClusteringAtZoom: 16,
      maxClusterRadius: 45
    });
  } catch (e) {
    cluster = L.layerGroup();
  }
  cluster.addTo(map);

  function esc(v) {
    return String(v ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function pinIcon(count) {
    const big = count > 9;
    const size = big ? 24 : 20;
    return L.divIcon({
      className: '',
      html: `<div style="width:${size}px;height:${size}px;background:#343a40;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 5px rgba(0,0,0,.4);color:#fff;font-size:${big ? 9 : 10}px;font-weight:700;display:flex;align-items:center;justify-content:center">${count > 1 ? count : '●'}</div>`,
      iconSize: [size, size],
      iconAnchor: [size / 2, size / 2]
    });
  }

  function mapsLink(a) {
    return `https://www.google.com/maps/search/?api=1&query=${a.lat},${a.lng}`;
  }

  function commonVendor(group) {
    const v = group[0].vendor;
    return (v && group.every(x => x.vendor === v)) ? v : null;
  }

  function groupActivities(list) {
    const m = new Map();
    list.forEach(a => {
      const key = `${a.lat.toFixed(6)}|${a.lng.toFixed(6)}`;
      if (!m.has(key)) m.set(key, []);
      m.get(key).push(a);
    });
    return Array.from(m.values());
  }

  function popup(group) {
    const a = group[0];
    const isMulti = group.length > 1;

    if (isMulti) {
      const cv = commonVendor(group);
      const title = cv || a.location || 'Activity Location';
      const sub = cv 
        ? `${group.length} live activities${a.location ? ' • ' + esc(a.location) : ''}`
        : `${group.length} live activities at this location`;

      return `<div>
        <div class="popup-title">${esc(title)}</div>
        <div class="popup-sub">${sub}</div>
        <div class="activity-list">
          ${group.map(x => `
            <div class="activity-item">
              <div class="activity-name">${esc(x.name)}</div>
              <div class="activity-meta">${esc(x.vendor)} • ${esc(x.category)}${x.rate ? ' • ₹' + esc(x.rate) : ''}</div>
            </div>
          `).join('')}
        </div>
        <a href="${mapsLink(a)}" target="_blank" rel="noopener noreferrer" class="activity-link">Open in Google Maps</a>
      </div>`;
    }

    const locationPart = a.location ? ` • ${esc(a.location)}` : '';
    const ratePart = a.rate !== '' ? `<div class="rate-row"><strong>Rate:</strong> ₹${esc(a.rate)}</div>` : '';

    return `<div>
      <div class="popup-title">${esc(a.name)}</div>
      <div class="popup-sub">${esc(a.vendor)}${locationPart}</div>
      <div class="popup-tags">
        <span class="tag">${esc(a.category)}</span>
        <span class="tag">${esc(a.area)}</span>
      </div>
      ${ratePart}
      <a href="${mapsLink(a)}" target="_blank" rel="noopener noreferrer" class="activity-link">Open in Google Maps</a>
    </div>`;
  }

  function populateDropdown(id, items, kind) {
    const box = document.getElementById(id);
    box.innerHTML = '';
    items.forEach(x => {
      const label = document.createElement('label');
      label.className = 'dropdown-item';
      label.dataset.name = x.toLowerCase();
      label.innerHTML = `<input type="checkbox" value="${esc(x)}"><span>${esc(x)}</span>`;
      box.appendChild(label);
    });
    box.querySelectorAll('input').forEach(cb => cb.addEventListener('change', () => {
      updateLabel(kind);
      apply();
    }));
  }

  function populateCategoryList(counts) {
    const box = document.getElementById('categoryList');
    box.innerHTML = '';
    counts.forEach(([cat, num]) => {
      const label = document.createElement('label');
      label.className = 'category-check-item';
      label.dataset.category = cat;
      label.innerHTML = `
        <span class="cat-left">
          <span class="cat-name">${esc(cat)}</span>
          <span class="count-pill cat-count">${num}</span>
        </span>
        <input type="checkbox" value="${esc(cat)}">
      `;
      box.appendChild(label);
    });
    box.querySelectorAll('input').forEach(cb => cb.addEventListener('change', apply));
  }

  function updateCategoryCounts(list) {
    const counts = {};
    list.forEach(a => {
      if (a.category) counts[a.category] = (counts[a.category] || 0) + 1;
    });
    document.querySelectorAll('#categoryList .category-check-item').forEach(row => {
      row.querySelector('.cat-count').textContent = counts[row.dataset.category] || 0;
    });
  }

  function selected(id) {
    return Array.from(document.querySelectorAll(`#${id} input:checked`)).map(x => x.value);
  }

  function updateLabel(kind) {
    const arr = selected('vendorList');
    document.getElementById(`${kind}Label`).textContent = arr.length ? `${arr.length} selected` : 'All vendors';
  }

  function apply() {
    const query = document.getElementById('keywordSearch').value.trim().toLowerCase();
    const cats = selected('categoryList');
    const vendors = selected('vendorList');

    const preCategory = ACTIVITIES.filter(a => {
      const matchArea = (selectedArea === 'all' || a.area === selectedArea);
      const matchVendor = (!vendors.length || vendors.includes(a.vendor));
      const matchQuery = !query || `${a.name} ${a.vendor} ${a.category} ${a.location} ${a.sku}`.toLowerCase().includes(query);
      return matchArea && matchVendor && matchQuery;
    });

    const filtered = preCategory.filter(a => !cats.length || cats.includes(a.category));

    cluster.clearLayers();
    markers = [];
    groupActivities(filtered).forEach(grp => {
      const m = L.marker([grp[0].lat, grp[0].lng], { icon: pinIcon(grp.length) })
        .bindPopup(popup(grp), {
          maxWidth: 420,
          autoPan: true,
          closeButton: true
        });

      // Default behaviour binds popup-open only to click; replace it so hover
      // previews the card and click pins it open until dismissed.
      m.off('click', m._openPopup, m);

      let pinned = false;
      let closeTimer = null;
      const cancelClose = () => { if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; } };
      const scheduleClose = () => {
        if (pinned) return;
        closeTimer = setTimeout(() => m.closePopup(), 200);
      };

      m.on('mouseover', () => { cancelClose(); m.openPopup(); });
      m.on('mouseout', scheduleClose);

      m.on('click', () => {
        if (pinned) {
          pinned = false;
          m.closePopup();
        } else {
          pinned = true;
          cancelClose();
          m.openPopup();
        }
      });

      m.on('popupopen', (e) => {
        const el = e.popup.getElement();
        if (el) {
          el.addEventListener('mouseenter', cancelClose);
          el.addEventListener('mouseleave', scheduleClose);
        }
      });

      m.on('popupclose', () => { pinned = false; cancelClose(); });

      markers.push(m);
      cluster.addLayer(m);
    });

    document.getElementById('activityCount').textContent = `Showing ${filtered.length} of ${ACTIVITIES.length} mapped live activities`;
    document.getElementById('mobileCount').textContent = filtered.length;
    updateCategoryCounts(preCategory);
  }

  function clampToGoa(b) {
    const goaSw = GOA_BOUNDS.getSouthWest(), goaNe = GOA_BOUNDS.getNorthEast();
    const sw = b.getSouthWest(), ne = b.getNorthEast();
    return L.latLngBounds(
      [Math.max(sw.lat, goaSw.lat), Math.max(sw.lng, goaSw.lng)],
      [Math.min(ne.lat, goaNe.lat), Math.min(ne.lng, goaNe.lng)]
    );
  }

  function fit() {
    const layers = cluster.getLayers();
    if (!layers.length) {
      map.fitBounds(GOA_BOUNDS, { animate: true });
      return;
    }
    const bounds = clampToGoa(L.featureGroup(layers).getBounds().pad(0.15));
    map.fitBounds(bounds, { animate: true, maxZoom: 15 });
  }

  function reset() {
    document.getElementById('keywordSearch').value = '';
    selectedArea = 'all';
    document.querySelectorAll('#areaGroup .group-btn').forEach(b => b.classList.toggle('active', b.dataset.area === 'all'));
    document.querySelectorAll('#categoryList input, #vendorList input').forEach(c => c.checked = false);
    document.getElementById('vendorSearch').value = '';
    document.querySelectorAll('#vendorList .dropdown-item').forEach(x => x.style.display = 'flex');
    updateLabel('vendor');
    apply();
    map.setView(MAP_CENTER, DEFAULT_ZOOM);
  }

  function initialize() {
    const catCounts = {};
    ACTIVITIES.forEach(a => {
      if (a.category) catCounts[a.category] = (catCounts[a.category] || 0) + 1;
    });

    const catEntries = Object.entries(catCounts).sort((a, b) => b[1] - a[1]);
    const vendors = [...new Set(ACTIVITIES.map(a => a.vendor).filter(Boolean))].sort();

    populateCategoryList(catEntries);
    populateDropdown('vendorList', vendors, 'vendor');
    apply();
  }

  function processResults(results) {
    ACTIVITIES = results.data.map(r => ({
      sku: String(r['SKU Code'] ?? '').trim(),
      name: String(r['Activity Name'] ?? '').trim(),
      vendor: String(r['Vendor Name'] ?? '').trim(),
      category: String(r['Category'] ?? '').replace(/\s+/g, ' ').trim(),
      status: String(r['Current Status'] ?? '').trim(),
      location: String(r['Location'] ?? '').trim(),
      lat: Number(String(r['Latitude'] ?? '').replace(/,/g, '')),
      lng: Number(String(r['Longitute'] ?? r['Longitude'] ?? '').replace(/,/g, '')),
      area: /North Goa/i.test(String(r['Activity Name'] ?? '')) ? 'North Goa' :
            /South Goa/i.test(String(r['Activity Name'] ?? '')) ? 'South Goa' : 'Goa',
      rate: r['Rates'] ?? ''
    })).filter(a => Number.isFinite(a.lat) && Number.isFinite(a.lng));

    initialize();
  }

  function showFallback(msg) {
    document.getElementById('activityCount').textContent = 'Waiting for CSV file...';
    document.getElementById('csvFallback').style.display = 'flex';
    if (msg) document.getElementById('csvFallbackError').textContent = msg;
  }

  function loadCSV() {
    document.getElementById('activityCount').textContent = 'Loading activities from CSV...';
    Papa.parse('./Activities_with_latitude_longitude.csv', {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        if (!results.data || !results.data.length || !results.meta || !results.meta.fields || results.meta.fields.length < 2) {
          showFallback('Automatic load returned no data.');
          return;
        }
        processResults(results);
      },
      error: function() {
        showFallback();
      }
    });
  }

  document.getElementById('csvFileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        document.getElementById('csvFallback').style.display = 'none';
        processResults(results);
      },
      error: function(err) {
        document.getElementById('csvFallbackError').textContent = 'Could not parse file: ' + (err && err.message ? err.message : 'Unknown error');
      }
    });
  });

  document.querySelectorAll('#areaGroup .group-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#areaGroup .group-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      selectedArea = b.dataset.area;
      apply();
    });
  });

  document.getElementById('keywordSearch').addEventListener('input', apply);
  document.getElementById('fitBtn').addEventListener('click', fit);
  document.getElementById('resetBtn').addEventListener('click', reset);
  document.getElementById('mobile-toggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('mobile-open');
  });

  const vBtn = document.getElementById('vendorBtn');
  const vDropdown = document.getElementById('vendorDropdown');
  const vSearch = document.getElementById('vendorSearch');

  vBtn.addEventListener('click', e => {
    e.stopPropagation();
    vDropdown.classList.toggle('open');
    if (vDropdown.classList.contains('open')) {
      setTimeout(() => vSearch.focus(), 30);
    }
  });

  vSearch.addEventListener('input', function() {
    const q = this.value.toLowerCase();
    document.querySelectorAll('#vendorList .dropdown-item').forEach(x => {
      x.style.display = x.dataset.name.includes(q) ? 'flex' : 'none';
    });
  });

  document.getElementById('selectAllCategories').addEventListener('click', () => {
    document.querySelectorAll('#categoryList input').forEach(c => c.checked = true);
    apply();
  });

  document.getElementById('clearAllCategories').addEventListener('click', () => {
    document.querySelectorAll('#categoryList input').forEach(c => c.checked = false);
    apply();
  });

  document.getElementById('selectAllVendors').addEventListener('click', () => {
    document.querySelectorAll('#vendorList input').forEach(c => c.checked = true);
    updateLabel('vendor');
    apply();
  });

  document.getElementById('clearAllVendors').addEventListener('click', () => {
    document.querySelectorAll('#vendorList input').forEach(c => c.checked = false);
    updateLabel('vendor');
    apply();
  });

  document.addEventListener('click', () => vDropdown.classList.remove('open'));
  document.getElementById('vendorMenu').addEventListener('click', e => e.stopPropagation());

  loadCSV();
  </script>
</body>
</html>
